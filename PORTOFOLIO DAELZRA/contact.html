  <main>
    <h1>Hubungi <span class="judul-warna">Saya</span></h1>
    <section class="baris baris-2">
      <article class="card">
        <form action="" method="post">
          <label for="nama">Nama</label>
          <input type="text" name="nama" id="nama" placeholder="Nama kamu" required>
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="nama@email.com" required>
          <label for="subject">Subject</label>
          <input type="text" name="subject" id="subject" placeholder="Topik pesan">
          <label for="message">Message</label>
          <textarea name="message" id="message" cols="40" rows="5" placeholder="Tulis pesan di sini" required></textarea>
          <button class="tombol" type="submit">Send Message</button>
        </form>
      </article>

      <aside class="card">
        <h3>Sosial Media</h3>
        <ul class="sosmed">
